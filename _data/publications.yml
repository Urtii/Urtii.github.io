# ============================================================
# publications.yml — ordered newest first
# Bold **Onurcan Yılmaz** is processed by markdownify in the template.
#
# type: journal | conference | abstract | poster | thesis
#   Drives the filter checkboxes on /publications/. "thesis" entries
#   are not filterable — they always render regardless of checkbox state.
#   Within each year, entries are grouped by type in a fixed priority
#   order: thesis > journal > conference > abstract > poster.
#
# author_position: 1-indexed position of Onurcan Yılmaz in `authors`.
#   Within the same type (and year), lower author_position sorts first.
#
# links: paper | code | slides | poster
#   All optional — omit any key and its button simply won't render.
#   No `bibtex` field — cite from the DOI/paper link instead of a
#   hand-generated (and possibly wrong) BibTeX block.
#   `slides` / `poster` point to an uploaded deck or poster PDF and are
#   independent of `type` — e.g. a conference paper can carry a `poster`
#   link too if one was presented alongside it.
# ============================================================

